name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos. Build the MIT-licensed CLI from source instead:
      # `go install` fetches exactly this tag and verifies every module against
      # the Go checksum database. setup-go puts GOPATH/bin on PATH.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          gitleaks detect --source . --redact --verbose --exit-code 1

  leak-guard:
    name: no-internal-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for internal/tenant markers (must be absent)
        env:
          # Organisation-specific markers (hosts, IPs, fiscal IDs) come from the
          # LEAK_GUARD_PATTERNS repository secret, never from this file: the
          # plugin folder is the repository root, so anything written here is
          # shipped to every installer.
          PRIVATE_PATTERNS: ${{ secrets.LEAK_GUARD_PATTERNS }}
        run: |
          # This repo must contain NO internal client data, infra hosts, fiscal
          # IDs or credentials. Only the vendor-neutral tooling + the public
          # Transgenia author/brand and services offer are allowed.
          generic='BEGIN [A-Z ]*PRIVATE KEY|ODOO_API_KEY=[A-Za-z0-9]{8,}|ODOO_PASSWORD=[^<>]'
          excludes="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.github"
          failed=0
          if grep -RInE "$generic" $excludes .; then
            echo "::error::Credential-like value found (see matches above)"
            failed=1
          fi
          if [ -z "$PRIVATE_PATTERNS" ]; then
            echo "::warning::LEAK_GUARD_PATTERNS secret not set; only generic credential patterns were checked"
          elif grep -RIlE "$PRIVATE_PATTERNS" $excludes .; then
            # file names only: printing the matching line would publish the marker
            echo "::error::Internal marker found in the files listed above"
            failed=1
          fi
          [ "$failed" -eq 0 ] && echo "OK: no internal-data markers found."
          exit "$failed"
