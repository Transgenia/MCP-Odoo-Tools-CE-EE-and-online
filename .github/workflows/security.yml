name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos; the upstream CLI is free (MIT) and scans the
      # same full git history. Pinned by version and checksum.
      - name: gitleaks (CLI)
        env:
          GITLEAKS_VERSION: "8.18.4"
          GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  leak-guard:
    name: no-internal-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for internal/tenant markers (must be absent)
        run: |
          # This repo must contain NO internal client data, infra hosts, fiscal
          # IDs or credentials. Only the vendor-neutral tooling + the public
          # Transgenia author/brand and services offer are allowed.
          patterns='CTR1708039T5|192\.227\.249\.105|74\.208\.106\.165|odoo\.transgenia\.org|transgenia\.odoo\.com|BEGIN [A-Z ]*PRIVATE KEY|ODOO_API_KEY=[A-Za-z0-9]{8,}|ODOO_PASSWORD=[^<>]'
          if grep -RInE "$patterns" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
              --exclude-dir=.github .; then
            echo "::error::Forbidden internal/secret marker found (see matches above)"
            exit 1
          fi
          echo "OK: no internal-data markers found."
