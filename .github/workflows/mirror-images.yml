name: Mirror sandbox images

# /odoo-tools:deploy-local pulls Odoo Community (the official `odoo` image is CE;
# Enterprise and Online cannot be redistributed) and PostgreSQL from ghcr.io/transgenia so
# the whole sandbox is served by Transgenia. This copies the official
# multi-arch images (manifests and layers, unchanged) and refreshes them weekly
# so upstream security fixes keep flowing. deploy_local.py falls back to Docker
# Hub if a mirror is missing.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_call:          # from release.yml (a GITHUB_TOKEN release fires no events)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The four Odoo tags upload to the same GHCR package; running them all at
      # once hit GHCR's upload rate limit (HTTP 429) on the v1.3.0 release.
      max-parallel: 2
      matrix:
        image:
          - { src: "odoo:10.0", dst: "odoo:10.0" }
          - { src: "odoo:11.0", dst: "odoo:11.0" }
          - { src: "odoo:12.0", dst: "odoo:12.0" }
          - { src: "odoo:13.0", dst: "odoo:13.0" }
          - { src: "odoo:14.0", dst: "odoo:14.0" }
          - { src: "odoo:15.0", dst: "odoo:15.0" }
          - { src: "odoo:16.0", dst: "odoo:16.0" }
          - { src: "odoo:17.0", dst: "odoo:17.0" }
          - { src: "odoo:18.0", dst: "odoo:18.0" }
          - { src: "odoo:19.0", dst: "odoo:19.0" }
          - { src: "postgres:10", dst: "postgres:10" }
          - { src: "postgres:12", dst: "postgres:12" }
          - { src: "postgres:13", dst: "postgres:13" }
          - { src: "postgres:16", dst: "postgres:16" }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy docker.io/library/${{ matrix.image.src }}
        run: |
          DST="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.dst }}"
          # Registry rate limits (GHCR or Docker Hub HTTP 429) are transient:
          # retry with backoff instead of failing the release.
          for attempt in 1 2 3 4; do
            if docker buildx imagetools create --tag "$DST" "docker.io/library/${{ matrix.image.src }}"; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::could not copy ${{ matrix.image.src }} after $attempt attempts"; exit 1
            fi
            sleep $((attempt * 30))
          done
          docker buildx imagetools inspect "$DST" | head -20
