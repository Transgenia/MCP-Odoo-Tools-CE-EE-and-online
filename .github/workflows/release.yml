name: Release

# Tag vX.Y.Z, or Actions → Release → Run workflow on main with tag vX.Y.Z
# (the `tag` job creates the tag there when it does not exist yet) →
#   verify: versions agree with the tag + lint + tests
#   build-standard: sdist/wheel + plugin zip
#   container: ghcr.io/transgenia/odoo-mcp-tools:{X.Y.Z, X.Y, latest} (amd64 + arm64)
#   github-release: Release with this version's CHANGELOG section + artifacts
#   mirror: refreshes the Odoo/PostgreSQL mirrors used by /odoo-tools:deploy-local
#   pypi: uploads server/dist to PyPI (trusted publishing, last so a missing PyPI
#         setup never blocks the Release or the image)
# A release created with GITHUB_TOKEN triggers no other workflow, so these run
# here instead of on `release: published`.
#
# Draft mode (manual runs with `draft` checked): tag + verify + build-standard,
# then a DRAFT GitHub Release with the artifacts. Nothing reaches users: no
# image, no PyPI, no mirror. A maintainer reviews the draft and selects
# **Publish release**; that human action is a `release: published` event, which
# runs verify, build-standard, container, github-release (refreshes the assets
# from the same tag), mirror and pypi. To discard a draft instead, delete it and
# the tag (`git push --delete origin vX.Y.Z`) before running again.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.3.0). Created on main if it does not exist yet."
        required: true
      draft:
        description: "Draft only: tag, tests and a draft GitHub Release; no image, no PyPI until the draft is published."
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

env:
  # On `release: published`, github.ref_name is the release's tag.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}

jobs:
  tag:
    # Manual runs only: lets a maintainer without a local clone cut a release.
    # A tag pushed with GITHUB_TOKEN starts no second run of this workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether a new tag is needed
        id: need
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; releasing it as it is."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::new tags are created from main only (this run is on $GITHUB_REF)"; exit 1
          fi
          echo "create=true" >> "$GITHUB_OUTPUT"
      # Everything `verify` checks runs here first: a tag is permanent, so a
      # wrong version or a failing test must stop the run before it exists.
      - name: Versions match the tag
        if: steps.need.outputs.create == 'true'
        run: python3 scripts/check_release_version.py "$TAG"
      - name: Lint and unit tests
        if: steps.need.outputs.create == 'true'
        working-directory: server
        run: |
          pip install -e ".[dev,cache]"
          ruff check src tests ../scripts ../hooks
          pytest -q -m "not live"
      - name: Create the tag on main
        if: steps.need.outputs.create == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "odoo-tools $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $(git rev-parse HEAD)"

  preflight:
    needs: tag
    # Before any publishing job starts: a draft run needs a tag with no release yet,
    # and a full run must not push an image for a tag whose release still waits as a
    # draft (publishing that draft runs the rest). GitHub lists draft releases only to
    # a token with push access ("Only users with push access will receive listings for
    # draft releases"), so this job gets contents: write and, to keep that token away
    # from any code, checks out and runs nothing but the gh query.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release state for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1
          fi
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\") | .isDraft") \
            || { echo "::error::could not list the releases, so the release state of $TAG is unknown"; exit 1; }
          echo "release for $TAG: ${existing:-none} (isDraft)"
          if [ "$DRAFT" = "true" ] && [ -n "$existing" ]; then
            echo "::error::a release for $TAG already exists (draft: $existing); delete it first"; exit 1
          fi
          if [ "$DRAFT" != "true" ] && echo "$existing" | grep -qx true; then
            echo "::error::$TAG has a draft release: publish it (that runs the rest) or delete it"; exit 1
          fi

  verify:
    needs: preflight
    # Runs after `tag` and `preflight` on manual runs; on tag pushes and release
    # events `tag` is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag shape
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1
          fi
      - name: Versions match the tag
        run: python3 scripts/check_release_version.py "$TAG"
      - name: Install
        working-directory: server
        run: pip install -e ".[dev,cache]"
      - name: Ruff
        working-directory: server
        run: ruff check src tests ../scripts ../hooks
      - name: Pytest (unit)
        working-directory: server
        run: pytest -q -m "not live"

  build-standard:
    needs: verify
    # Explicit, like every job after `verify`: on a tag push or a release event the
    # `tag` job is skipped, and an implicit success() would skip this job too.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          cd server && python -m build --outdir dist
      - name: Build standard plugin zip
        run: |
          VERSION="${TAG#v}"
          zip -r "odoo-tools-standard-${VERSION}.zip" \
            .claude-plugin agents skills commands context hooks cli docs server scripts docker \
            README.md SUPPORT.md SECURITY.md PRIVACY.md CHANGELOG.md CONTRIBUTING.md LICENSE NOTICE \
            -x "cli/node_modules/*" "cli/.env" "server/dist/*" "server/.venv/*" \
               "*/__pycache__/*" "server/.pytest_cache/*" "server/.ruff_cache/*"
      - name: Release notes (this version only)
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standard-${{ env.TAG }}
          path: |
            server/dist
            odoo-tools-standard-*.zip
            release-notes.md

  container:
    needs: verify
    # Draft mode publishes nothing: the image is built once the draft is published.
    if: ${{ !failure() && !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # all tags, to decide whether this is the newest release
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/odoo-mcp-tools"
          # Moving tags only move forward: re-running an older tag (manual
          # dispatch) must not point `latest` or `X.Y` back at an older image.
          # Compare with published releases plus this tag: a tag kept by an
          # unpublished draft is not a release and must not hold `latest` back.
          # A failing gh must stop the job: with an empty list this tag would look
          # like the newest one and move `latest` and `X.Y` to it.
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts \
                        --json tagName --jq '.[].tagName') \
            || { echo "::error::could not list the published releases, so the moving tags cannot be decided"; exit 1; }
          versions=$( { printf '%s\n' "$published"; echo "$TAG"; } \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -V -r)
          newest=$(echo "$versions" | head -n1)
          newest_minor=$(echo "$versions" | grep -F "v${V%.*}." | head -n1)
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${V}"
            if [ "$TAG" = "$newest_minor" ]; then echo "${IMAGE}:${V%.*}"; fi
            if [ "$TAG" = "$newest" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
            echo "version=${V}"
          } >> "$GITHUB_OUTPUT"
          echo "newest tag: $newest; newest in ${V%.*}: $newest_minor"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.vendor=Transgenia
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=odoo-tools MCP server by Transgenia (Odoo 10-19, CE/EE/online)

  github-release:
    needs: [build-standard, container]
    if: >-
      ${{ !cancelled() && needs.build-standard.result == 'success'
          && (needs.container.result == 'success'
              || (github.event_name == 'workflow_dispatch' && inputs.draft
                  && needs.container.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: standard-${{ env.TAG }}
          path: assets
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R assets
          files=(assets/server/dist/* assets/odoo-tools-standard-*.zip)
          # `gh release view <tag>` does not see drafts; the list does.
          existing=$(gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")
          if [ "$DRAFT" = "true" ]; then
            if [ -n "$existing" ]; then
              echo "::error::a release for $TAG already exists (draft: $existing); delete it first"; exit 1
            fi
            gh release create "$TAG" --verify-tag --draft --title "odoo-tools $TAG" \
              --notes-file assets/release-notes.md "${files[@]}"
            echo "Draft ready: $(gh release view "$TAG" --json url --jq .url 2>/dev/null || echo 'see the Releases page')"
          elif [ "$existing" = "false" ]; then
            # Published from a reviewed draft (or a re-run): the assets on the
            # Release must be the files this run uploads to PyPI.
            gh release upload "$TAG" --clobber "${files[@]}"
          elif [ -n "$existing" ]; then
            echo "::error::$TAG still has a draft release; publish or delete it"; exit 1
          else
            gh release create "$TAG" --verify-tag --title "odoo-tools $TAG" \
              --notes-file assets/release-notes.md "${files[@]}"
          fi

  mirror:
    needs: github-release
    if: ${{ !failure() && !cancelled() && needs.github-release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.draft) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror-images.yml

  pypi:
    needs: github-release
    if: ${{ !failure() && !cancelled() && needs.github-release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.draft) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC), no API token stored
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: standard-${{ env.TAG }}
          path: assets
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: assets/server/dist
