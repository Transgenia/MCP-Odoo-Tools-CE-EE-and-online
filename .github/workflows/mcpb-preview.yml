name: Desktop extension preview

# Builds the Claude Desktop extension (.mcpb) of the plugin's MCP server as a
# preview, validates its manifest with the official MCPB CLI, checks that the
# bundled server answers initialize and tools/list with no network and no Odoo
# settings, and uploads the .mcpb as a workflow artifact for manual testing in
# Claude Desktop (docs/desktop-extension.md).
#
# The .mcpb never enters the repository: the repository root is the plugin
# folder, and the Claude plugin directory holds for review a plugin that declares
# its MCP server as a .mcpb or ships a .zip or .mcpb file there. This workflow
# publishes and releases nothing.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # An exact version, so validation and unpacking cannot change under a run.
  MCPB: "@anthropic-ai/mcpb@2.1.2"

jobs:
  mcpb:
    name: build, validate, smoke, upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The oldest Python the manifest accepts (Apple's Command Line Tools ship 3.9).
          python-version: "3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build the bundle
        run: python3 scripts/build_mcpb.py
      - name: Unpack it with the MCPB CLI
        # The MCPB library's unpacker, the code Claude Desktop loads bundles with.
        run: npx -y "$MCPB" unpack dist/*.mcpb "$RUNNER_TEMP/bundle"
      - name: Validate manifest.json against the MCPB schema
        run: npx -y "$MCPB" validate "$RUNNER_TEMP/bundle/manifest.json"
      - name: Smoke test with no network (initialize, tools/list)
        # An empty network namespace; --offline fails if anything is reachable.
        run: |
          sudo unshare --net -- "$(command -v python3)" scripts/build_mcpb.py \
            --smoke "$RUNNER_TEMP/bundle" --offline
      - name: Upload the .mcpb
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the .mcpb itself, named after the file, so the
          # download installs with a double-click instead of arriving in a zip.
          path: dist/*.mcpb
          archive: false
          if-no-files-found: error
          overwrite: true
      - name: Summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Claude Desktop extension preview"
            echo
            for f in dist/*.mcpb; do
              echo "- \`$(basename "$f")\`: $(stat -c %s "$f") bytes," \
                "SHA-256 \`$(sha256sum "$f" | cut -d ' ' -f 1)\`"
            done
            echo "- Download: $ARTIFACT_URL"
            echo
            echo "Install and manual test: docs/desktop-extension.md"
          } >> "$GITHUB_STEP_SUMMARY"
