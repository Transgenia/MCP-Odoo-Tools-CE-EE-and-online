name: Desktop extension preview

# Builds the Claude Desktop extension (.mcpb) of the plugin's MCP server as a
# preview, checks that the bundled server answers initialize and tools/list with
# no network and no Odoo settings, validates its manifest with the official MCPB
# CLI, and uploads the .mcpb as a workflow artifact for manual testing in Claude
# Desktop (docs/desktop-extension.md).
#
# The .mcpb never enters the repository: the repository root is the plugin
# folder, and the Claude plugin directory holds for review a plugin that declares
# its MCP server as a .mcpb or ships a .zip or .mcpb file there. This workflow
# publishes and releases nothing.
#
# Two jobs, so that no package from the npm registry runs where the uploaded file
# is built: "build" uses only Python and this repository, and uploads the bundle
# (never for a pull request from a fork); "validate" builds the same bytes again
# (the build is deterministic), checks that its SHA-256 matches, and only then runs
# the MCPB CLI on its own copy.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # An exact version. Its own dependencies resolve at run time, which is why the
  # CLI runs only in the validate job, away from the uploaded file.
  MCPB: "@anthropic-ai/mcpb@2.1.2"

jobs:
  build:
    name: build, smoke, upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The oldest Python the manifest accepts (Apple's Command Line Tools ship 3.9).
          python-version: "3.9"
      - name: Build the bundle
        run: python3 scripts/build_mcpb.py
      - name: Smoke test with no network (initialize, tools/list)
        # An empty network namespace; --offline fails if anything is reachable.
        run: |
          sudo unshare --net -- "$(command -v python3)" scripts/build_mcpb.py \
            --smoke dist/*.mcpb --offline
      - name: SHA-256
        id: hash
        run: echo "sha256=$(sha256sum dist/*.mcpb | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload the .mcpb
        id: upload
        # Never an installable file built from a fork's pull request.
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the .mcpb itself, named after the file, so the
          # download installs with a double-click instead of arriving in a zip.
          path: dist/*.mcpb
          archive: false
          if-no-files-found: error
          overwrite: true
      - name: Summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Claude Desktop extension preview"
            echo
            for f in dist/*.mcpb; do
              echo "- \`$(basename "$f")\`: $(stat -c %s "$f") bytes," \
                "SHA-256 \`$(sha256sum "$f" | cut -d ' ' -f 1)\`"
            done
            echo "- Download: ${ARTIFACT_URL:-not uploaded (a pull request from a fork)}"
            echo
            echo "Install and manual test: docs/desktop-extension.md"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: validate with the MCPB CLI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build the same bundle again
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          python3 scripts/build_mcpb.py
          actual="$(sha256sum dist/*.mcpb | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::this build ($actual) differs from the uploaded one ($EXPECTED)"
            exit 1
          fi
      - name: Unpack it with the MCPB CLI
        # The MCPB library's unpacker, the code Claude Desktop loads bundles with.
        run: npx -y "$MCPB" unpack dist/*.mcpb "$RUNNER_TEMP/bundle"
      - name: Validate manifest.json against the MCPB schema
        run: npx -y "$MCPB" validate "$RUNNER_TEMP/bundle/manifest.json"
      - name: Smoke test the unpacked bundle with no network
        run: |
          sudo unshare --net -- "$(command -v python3)" scripts/build_mcpb.py \
            --smoke "$RUNNER_TEMP/bundle" --offline
